version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devlens-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devlens_prod}
      POSTGRES_USER: ${POSTGRES_USER:-devlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlens_secure_pass}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devlens} -d ${POSTGRES_DB:-devlens_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devlens-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: devlens-prod-qdrant
    restart: always
    volumes:
      - qdrant_prod_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devlens-prod-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devlens}:${POSTGRES_PASSWORD:-devlens_secure_pass}@postgres:5432/${POSTGRES_DB:-devlens_prod}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: devlens_code_chunks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devlens-prod-celery
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devlens}:${POSTGRES_PASSWORD:-devlens_secure_pass}@postgres:5432/${POSTGRES_DB:-devlens_prod}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devlens-prod-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: devlens-prod-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_prod_data:
  redis_prod_data:
  qdrant_prod_data:
