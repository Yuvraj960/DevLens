[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens-backend"
version = "0.1.0"
description = "DevLens AI-Powered Code Intelligence Platform Backend"
authors = [{ name = "DevLens Team", email = "team@devlens.dev" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "tree-sitter>=0.21.3",
    "qdrant-client>=1.8.0",
    "litellm>=1.31.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
